services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: webgis-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: webgis
      POSTGRES_PASSWORD: webgis123
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgis -d webgis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stage 2: Martin 向量瓦片服务
  # 访问: http://localhost:3000/catalog  查看所有可用表
  # 瓦片: http://localhost:3000/{table}/{z}/{x}/{y}
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: webgis-martin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Martin 通过容器内网络连接 PostGIS（postgis 服务名即 hostname）
      DATABASE_URL: "postgresql://webgis:webgis123@postgis:5432/webgis"
    depends_on:
      postgis:
        condition: service_healthy
    command:
      - --listen-addresses
      - "0.0.0.0:3000"

volumes:
  postgis_data:
